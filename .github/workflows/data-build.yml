name: Data build

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-build
  cancel-in-progress: false

jobs:
  build-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch feeds and write page JSON
        run: npm run build:data
      - name: Check every page file is under 2 KB
        run: node --experimental-strip-types scripts/build-data/check-sizes.ts
      - name: Commit changed data
        run: |
          if git diff --quiet -- public/data; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "page-100-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "chore: refresh page data"
          git push
